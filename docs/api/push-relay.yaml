openapi: 3.1.0
info:
  title: CairnOps Push Relay API
  version: 1.0.0
  description: >-
    Contrat minimal entre une instance CairnOps et le Relais Push officiel. Le
    destinataire est une capacité opaque délivrée au compagnon mobile par le
    relais ; l'enveloppe est chiffrée pour la clé de cet appareil. Le relais ne
    reçoit aucune URL d'instance, identité de compte, Cible ni donnée d'Incident
    en clair.
servers:
  - url: https://push.cairnops.example
paths:
  /v1/health:
    get:
      operationId: getPushRelayHealth
      responses:
        '204': { description: Relais prêt à accepter des livraisons }
        '503': { description: Configuration ou stockage du relais indisponible }
  /v1/registrations:
    post:
      operationId: createPushRegistration
      description: >-
        Échange le jeton APNs remis directement à l'application contre deux
        capacités indépendantes. `recipient` est transmis à l'instance CairnOps ;
        `management_token` reste uniquement dans le Keychain de l'appareil.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequest' }
      responses:
        '201':
          description: Inscription créée
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationCredentials' }
        '400': { description: Plateforme, environnement ou jeton APNs invalide }
        '429': { description: Limite de création atteinte }
  /v1/registrations/{recipient}:
    parameters:
      - name: recipient
        in: path
        required: true
        schema: { $ref: '#/components/schemas/RelayCapability' }
    put:
      operationId: rotatePushRegistration
      security: [{ RegistrationManagementBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequest' }
      responses:
        '204': { description: Jeton fournisseur remplacé }
        '400': { description: Plateforme, environnement ou jeton APNs invalide }
        '401': { description: Capacité de gestion absente ou invalide }
        '404': { description: Inscription inconnue }
    delete:
      operationId: deletePushRegistration
      security: [{ RegistrationManagementBearer: [] }]
      responses:
        '204': { description: Inscription supprimée }
        '401': { description: Capacité de gestion absente ou invalide }
        '404': { description: Inscription inconnue }
  /v1/deliveries:
    post:
      operationId: createPushDelivery
      description: >-
        Accepte une livraison pour un destinataire opaque. Le relais doit
        appliquer une limitation de débit par destinataire et ne jamais écrire
        le destinataire ni le corps complet dans ses journaux.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushDelivery' }
      responses:
        '202': { description: Livraison acceptée par le relais }
        '400': { description: Enveloppe ou métadonnées invalides }
        '404': { description: Destinataire opaque inconnu }
        '410': { description: Destinataire expiré ou révoqué }
        '429': { description: Limite de débit atteinte }
        '503': { description: Fournisseur mobile temporairement indisponible }
components:
  securitySchemes:
    RegistrationManagementBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque 256-bit capability
  schemas:
    RelayCapability:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: Capacité aléatoire de 256 bits en base64url sans remplissage.
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [platform, environment, device_token]
      properties:
        platform: { type: string, enum: [ios] }
        environment:
          type: string
          enum: [sandbox, production]
          description: Environnement APNs correspondant au profil signé de l'application.
        device_token:
          type: string
          pattern: '^[0-9a-fA-F]+$'
          description: Jeton APNs hexadécimal remis par iOS.
    RegistrationCredentials:
      type: object
      additionalProperties: false
      required: [recipient, management_token]
      properties:
        recipient: { $ref: '#/components/schemas/RelayCapability' }
        management_token: { $ref: '#/components/schemas/RelayCapability' }
    PushDelivery:
      type: object
      additionalProperties: false
      required: [recipient, envelope, collapse_key, priority, expires_at]
      properties:
        recipient:
          $ref: '#/components/schemas/RelayCapability'
          description: Capacité opaque sans signification opérationnelle pour le relais.
        envelope: { $ref: '#/components/schemas/EncryptedEnvelope' }
        collapse_key:
          type: string
          description: Empreinte opaque et stable de l'Incident, jamais son identifiant brut.
        priority: { type: string, enum: [normal, high] }
        expires_at: { type: string, format: date-time }
    EncryptedEnvelope:
      type: object
      additionalProperties: false
      required: [version, ephemeral_public_key, nonce, ciphertext]
      properties:
        version: { type: integer, enum: [1] }
        ephemeral_public_key:
          type: string
          description: Clé publique X25519 éphémère, 32 octets en base64url sans remplissage.
        nonce:
          type: string
          description: Nonce XChaCha20-Poly1305, 24 octets en base64url sans remplissage.
        ciphertext:
          type: string
          description: JSON chiffré et authentifié, encodé en base64url sans remplissage.
