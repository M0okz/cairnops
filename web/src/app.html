<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="icon" sizes="any" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="theme-color" content="#1c1b19" />
    <!-- Pose le choix explicite ou système avant la première peinture.
         Le calcul solaire est repris au montage, avec la ville mémorisée. -->
    <script>
      (function () {
        var mode;
        try { mode = localStorage.getItem('cairnops-theme'); } catch (_) {}
        document.documentElement.dataset.theme = mode === 'light' || mode === 'dark'
          ? mode : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
