---
name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        run: npm --prefix web ci

      - name: Check the Web application
        run: npm --prefix web run check

      - name: Build the Web application
        run: npm --prefix web run build

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Check the build version
        run: sh scripts/build-version.sh 42 | grep -Eq '^[0-9]+\.[0-9]+\.42$'

      - name: Test release-note generation
        run: sh scripts/release-notes-test.sh

  images:
    name: Build ${{ matrix.target }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - server
          - worker
          - relay
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build metadata
        id: build
        run: |
          echo "version=$(sh scripts/build-version.sh "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and publish ${{ matrix.target }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/m0okz/cairnops-${{ matrix.target }}:${{ steps.build.outputs.version }}
            ghcr.io/m0okz/cairnops-${{ matrix.target }}:${{ github.sha }}
            ghcr.io/m0okz/cairnops-${{ matrix.target }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/M0okz/cairnops
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.build.outputs.version }}
            org.opencontainers.image.created=${{ steps.build.outputs.date }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare release notes
        id: release
        run: |
          version="$(sh scripts/build-version.sh "$GITHUB_RUN_NUMBER")"
          tag="v${version}"
          previous_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 2>/dev/null || true)"
          sh scripts/release-notes.sh "$version" "$previous_tag" "$GITHUB_SHA" > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "CairnOps $RELEASE_VERSION" \
            --notes-file release-notes.md \
            --fail-on-no-commits
